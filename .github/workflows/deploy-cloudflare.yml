name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets (one-time GitHub setup)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error title=Missing secret::Add CLOUDFLARE_API_TOKEN — see DEPLOY.md in the repo."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error title=Missing secret::Add CLOUDFLARE_ACCOUNT_ID — see DEPLOY.md in the repo."
            exit 1
          fi
          echo "Cloudflare secrets are configured."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site (Vite → dist/)
        run: npm run build

      - name: Deploy to Workers (abubakarndumar)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
